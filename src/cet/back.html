{{FrontSide}}
<hr class="cet-divider">
<main id="BackSide" class="anki-card cet-card" lang="zh-Hans">
  <div class="cet-card__section cet-card__definition">{{解释}}</div>
  {{#词根}}<hr><div class="cet-card__section cet-card__root">{{词根}}</div>{{/词根}}
  {{#近义词}}<hr><div class="cet-card__section cet-card__synonyms">{{近义词}}</div>{{/近义词}}
  {{#例句}}<hr><div class="cet-card__section cet-card__examples">{{例句}}</div>{{/例句}}
  {{#权威例句}}<hr><div class="cet-card__section cet-card__authority">{{权威例句}}</div>{{/权威例句}}
</main>
